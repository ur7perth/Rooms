
name: RoomDuel
version: 1.0.0
main: com.roomduel.RoomDuelPlugin
api-version: '1.20'
description: 1v1 rooms that lock when two players enter.
commands:
  roomwand:
    description: Gives you the room selection wand (Golden Axe).
    usage: /roomwand
  setroom:
    description: Creates a room from your wand selection.
    usage: /setroom <name>
  blockroom:
    description: Changes the door block of a room.
    usage: /blockroom <name> <block>
  lockroom:
    description: Sets how fast rooms close after 2 players enter.
    usage: /lockroom <time> [room]
  unlockroom:
    description: Sets how long rooms take to reopen.
    usage: /unlockroom <time> [room]
  deleteroom:
    description: Deletes a room.
    usage: /deleteroom <name>
  roomex:
    description: Sets the exit point of a room (used when a player respawns inside a full room).
    usage: /roomex <name>
permissions:
  roomduel.admin:
    description: Allows using all RoomDuel commands and the wand.
    default: op
